# Local Postgres for the dev profile. Spring Boot's Docker Compose support starts it on
# `bootRun` with the dev profile; no manual `docker compose up`.
# Keep the image tag in sync with PostgresTestConfiguration.
#
# The `app` service is the containerized service itself (build it first with
# `./gradlew jibDockerBuild`). It is behind the `app` Compose profile, so Boot's Docker Compose
# support, which activates no profiles, never starts it; `docker compose --profile app up`
# starts both.
#
# The connection is configured explicitly in application-dev.yml instead of through Boot's
# service connection, which would hand the app the POSTGRES_USER superuser and bypass
# row-level security. docker/postgres/01-roles.sql creates the app, owner, and admin roles
# the first time the data volume is initialized (reset with `docker compose down -v`).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "${ORDERS_DB_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      # TCP check: the init-time server only listens on the Unix socket, so this turns
      # healthy only after 01-roles.sql has run and Postgres has restarted for real.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orders -d orders"]
      interval: 1s
      timeout: 3s
      retries: 30
    labels:
      org.springframework.boot.ignore: "true"

  app:
    image: suebai/order-intake:latest
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders_app
      SPRING_DATASOURCE_PASSWORD: orders_app
      SPRING_FLYWAY_USER: orders_owner
      SPRING_FLYWAY_PASSWORD: orders_owner
      # Dev reference data (tenants and patients), as in the dev profile. Local use only.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
    ports:
      - "${ORDERS_APP_PORT:-8080}:8080"
    healthcheck:
      # The distroless image has no shell or curl; probe /actuator/health with its own java.
      test:
        - CMD
        - java
        - -Xmx16m
        - -XX:+UseSerialGC
        - -XX:TieredStopAtLevel=1
        - -cp
        - /app/classes
        - com.jacobian.orders.ContainerHealthCheck
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    labels:
      org.springframework.boot.ignore: "true"
